<!-- Cabecera de la Vista -->
<section class="mb-4">
  <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-gray-100">
    <div>
      <h2 class="text-gray-800 font-bold text-lg">Historial</h2>
      <p class="text-xs text-gray-400">Tus movimientos recientes</p>
    </div>
    <div class="bg-emerald-100 text-emerald-600 p-2 rounded-lg cursor-pointer hover:bg-emerald-200 transition" onclick="refrescarRegistros()">
      <i class="fas fa-sync-alt"></i>
    </div>
  </div>
</section>

<!-- Contenedor de la Lista -->
<section class="bg-transparent mb-20">
  
  <div id="lista-registros" class="space-y-2 relative">
    <!-- Aquí se inyectan las cabeceras de fechas y las tarjetas -->
  </div>
  
  <!-- Estado de Carga -->
  <div id="loading-registros" class="flex flex-col items-center justify-center py-6 hidden bg-white rounded-xl mt-4 shadow-sm">
    <i class="fas fa-circle-notch fa-spin text-2xl text-emerald-600 mb-2"></i>
    <p class="text-sm text-gray-500">Cargando movimientos...</p>
  </div>
  
  <!-- Botón Cargar Más -->
  <button id="btn-cargar-mas" onclick="cargarMasRegistros()" class="hidden w-full mt-4 py-3 bg-white shadow-sm hover:bg-gray-50 border border-gray-200 text-gray-600 font-semibold rounded-xl text-sm transition">
    Cargar más registros <i class="fas fa-chevron-down ml-1"></i>
  </button>

  <!-- Mensaje Fin de Datos -->
  <div id="msg-fin-registros" class="hidden text-center py-6 text-gray-400 text-sm bg-white rounded-xl mt-4 shadow-sm">
    <i class="fas fa-check-circle mb-1 text-emerald-400 text-lg"></i><br>
    Has llegado al inicio de tu historial
  </div>
</section>

<script>
  // ¡REVISA QUE SEA TU URL ACTUAL (terminada en rdZM/exec)!
  const API_URL_REGISTROS = "https://script.google.com/macros/s/AKfycbxp4ySSgMGAM47n1Be12Hwo2hmWNWfYLQbk5ERleidhNXnpNZU2kEbq5r64W_eL6Lsd/exec";
  
  // ==============================================
  // DICCIONARIO DE ICONOS POR CATEGORÍA
  // ==============================================
  const diccionarioIconos = {
    "Comida": "fa-utensils",
    "Compras": "fa-shopping-bag",
    "Hogar": "fa-home",
    "Transporte": "fa-car",
    "Vehiculo": "fa-gas-pump",
    "Vida y entretenimiento": "fa-ticket-alt",
    "Comunicaciones": "fa-wifi",
    "Gastos personales": "fa-user",
    "Inversiones": "fa-chart-line",
    "Ingresos Personales": "fa-wallet",
    "Ingresos Negocios": "fa-store"
  };

  let offsetGlobal = 0;
  const LIMIT_INITIAL = 20;
  const LIMIT_MORE = 10;
  let isLoading = false;
  let ultimaFechaRenderizada = "";

  // Función Matemática para Contraste YIQ
  function obtenerColorTexto(hexColor) {
    if (!hexColor) return '#ffffff'; 
    let color = hexColor.replace('#', '');
    if (color.length === 3) color = color.split('').map(c => c + c).join(''); 
    const r = parseInt(color.substr(0, 2), 16);
    const g = parseInt(color.substr(2, 2), 16);
    const b = parseInt(color.substr(4, 2), 16);
    const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
    return (yiq >= 128) ? '#1f2937' : '#ffffff'; 
  }

  async function fetchRegistros(limit) {
    if (isLoading) return;
    
    isLoading = true;
    document.getElementById('loading-registros').classList.remove('hidden');
    document.getElementById('btn-cargar-mas').classList.add('hidden');
    
    try {
      const payload = { action: "obtenerRegistros", datos: { offset: offsetGlobal, limit: limit } };
      const response = await fetch(API_URL_REGISTROS, {
        method: 'POST', body: JSON.stringify(payload),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
      });
      const json = await response.json();
      
      if (json.estado === "exito") {
        renderizarListaRegistros(json.registros);
        offsetGlobal += json.registros.length; 
        
        if (json.hayMas) {
          document.getElementById('btn-cargar-mas').classList.remove('hidden');
        } else if (offsetGlobal > 0) {
          document.getElementById('msg-fin-registros').classList.remove('hidden');
        } else {
          document.getElementById('lista-registros').innerHTML = '<p class="text-center bg-white rounded-xl shadow-sm text-gray-400 py-6 text-sm">No hay transacciones registradas.</p>';
        }
      }
    } catch (e) {
      console.error(e);
      alert("Error al cargar el historial.");
    }
    
    document.getElementById('loading-registros').classList.add('hidden');
    isLoading = false;
  }

  function renderizarListaRegistros(registros) {
    const contenedor = document.getElementById('lista-registros');
    
    registros.forEach(reg => {
      // 1. FORMATEO Y AGRUPACIÓN DE FECHA (A prueba de balas)
      let fechaLimpia = reg.fecha;
      try {
        let d;
        if (reg.fecha.includes('/')) {
          // Si el backend lo envió bien como dd/mm/yyyy
          let partes = reg.fecha.split('/');
          d = new Date(partes[2], partes[1] - 1, partes[0]);
        } else {
          // Si el backend envió el texto crudo largo, forzamos su lectura
          d = new Date(reg.fecha);
        }

        if (!isNaN(d)) {
          // Construimos el formato exacto: DD/MM/YYYY
          let dia = String(d.getDate()).padStart(2, '0');
          let mes = String(d.getMonth() + 1).padStart(2, '0');
          let anio = d.getFullYear();
          fechaLimpia = `${dia}/${mes}/${anio}`; 
        }
      } catch(e) {}

      if (fechaLimpia !== ultimaFechaRenderizada) {
        contenedor.innerHTML += `
          <div class="sticky top-0 z-10 bg-gray-100/95 backdrop-blur py-2 mt-4 mb-2">
            <span class="text-xs font-bold text-gray-500 tracking-wider">${fechaLimpia}</span>
          </div>
        `;
        ultimaFechaRenderizada = fechaLimpia;
      }

      // 2. CONFIGURACIÓN DE ICONOS Y COLORES DINÁMICOS
      let colorMonto = 'text-gray-800';
      let iconoSelect = '';
      let titulo = '';
      let subtitulo = '';

      // Seleccionar Icono
      const iconoPorDefecto = reg.tipo === 'Ingreso' ? 'fa-arrow-up' : (reg.tipo === 'Transferencia' ? 'fa-exchange-alt' : 'fa-arrow-down');
      iconoSelect = diccionarioIconos[reg.categoria] || iconoPorDefecto;

      // Definir Colores 
      let bgIcon = reg.color ? reg.color : (reg.tipo === 'Ingreso' ? '#10b981' : (reg.tipo === 'Transferencia' ? '#3b82f6' : '#ef4444'));
      let textIcon = obtenerColorTexto(bgIcon);
      let inlineStyleIcon = `background-color: ${bgIcon}; color: ${textIcon};`;

      if (reg.tipo === 'Egreso') {
        colorMonto = 'text-red-600';
        titulo = reg.subcategoria || reg.categoria || 'Egreso';
        subtitulo = reg.subcategoria ? `${reg.categoria}` : '';
      } 
      else if (reg.tipo === 'Ingreso') {
        colorMonto = 'text-emerald-600';
        titulo = reg.subcategoria || reg.categoria || 'Ingreso';
        subtitulo = reg.subcategoria ? `${reg.categoria}` : '';
      } 
      else if (reg.tipo === 'Transferencia') {
        colorMonto = 'text-blue-600';
        titulo = reg.categoria ? (reg.subcategoria || reg.categoria) : 'Transferencia';
        subtitulo = `${reg.cuentaOrigen} ➔ ${reg.cuentaDestino}`;
      }

      const notasHtml = reg.nota ? `<p class="text-[10px] text-gray-400 italic mt-0.5"><i class="fas fa-comment-alt mr-1"></i>${reg.nota}</p>` : '';

      // 3. RENDERIZADO DE LA TARJETA
      contenedor.innerHTML += `
        <div class="flex items-center justify-between p-3 bg-white rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition">
          <div class="flex items-center gap-3 w-2/3">
            <div class="p-2 rounded-xl text-lg w-10 h-10 flex items-center justify-center shadow-sm" style="${inlineStyleIcon}">
              <i class="fas ${iconoSelect}"></i>
            </div>
            <div class="overflow-hidden flex-1">
              <p class="font-bold text-gray-800 text-sm truncate">${titulo}</p>
              ${subtitulo ? `<p class="text-[11px] text-gray-500 truncate">${subtitulo}</p>` : ''}
              ${notasHtml}
            </div>
          </div>
          <div class="text-right w-1/3">
            <p class="font-bold text-sm ${colorMonto} truncate">S/ ${reg.monto.toFixed(2)}</p>
            <p class="text-[10px] text-gray-400 truncate mt-1">${reg.tipo !== 'Transferencia' ? reg.cuentaOrigen : ''}</p>
          </div>
        </div>
      `;
    });
  }

  function cargarMasRegistros() {
    fetchRegistros(LIMIT_MORE);
  }

  function refrescarRegistros() {
    offsetGlobal = 0;
    ultimaFechaRenderizada = ""; 
    document.getElementById('lista-registros').innerHTML = '';
    document.getElementById('msg-fin-registros').classList.add('hidden');
    fetchRegistros(LIMIT_INITIAL); 
  }

  // Carga inicial
  setTimeout(() => fetchRegistros(LIMIT_INITIAL), 100);
</script>
